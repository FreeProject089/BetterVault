<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 360px;
      min-height: 480px;
      background-color: #0D1117;
      color: #F0F6FC;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid #30363D;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #58A6FF;
      color: #0D1117;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
    }
    .search-bar {
      width: 100%;
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 6px;
      padding: 8px 10px;
      color: #F0F6FC;
      font-size: 12px;
      outline: none;
    }
    .search-bar:focus { border-color: #58A6FF; }
    .cred-list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 320px;
      overflow-y: auto;
    }
    .cred-card {
      background: #161B22;
      border: 1px solid #30363D;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.15s ease;
    }
    .cred-card:hover {
      border-color: #58A6FF;
      background: #1F242C;
    }
    .cred-info { flex: 1; }
    .cred-title { font-size: 13px; font-weight: 600; }
    .cred-user { font-size: 11px; color: #8B949E; margin-top: 2px; }
    .autofill-btn {
      background: #238636;
      border: none;
      color: white;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .autofill-btn:hover { background: #2EA043; }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 10px;
      color: #8B949E;
      border-top: 1px solid #30363D;
      padding-top: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">B</div>
      <span>BUM Vault</span>
    </div>
    <span style="font-size:10px;color:#3FB950;font-family:monospace;">E2EE ACTIVE</span>
  </div>

  <input type="text" id="search-box" class="search-bar" placeholder="Rechercher pour ce site...">

  <div class="cred-list" id="credential-container">
    <!-- Rempli dynamiquement -->
  </div>

  <div class="footer">
    <span>Zéro-Knowledge Autofill</span>
    <span>v1.0.0</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
