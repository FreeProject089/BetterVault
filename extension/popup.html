<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetterVault</title>
  <link rel="stylesheet" href="../src/styles/main.css">
  <link rel="stylesheet" href="../src/styles/addons.css">
  <link rel="stylesheet" href="../src/extension/popup.css">
</head>
<body class="popup-body">
  <div id="auth-screen" class="auth-screen" hidden></div>

  <div id="popup-app" class="popup-app" hidden>
    <header class="popup-header">
      <div class="popup-brand">
        <img class="brand-logo brand-logo-dark" src="/brand/logo-on-dark.svg" alt="" width="22" height="22">
        <img class="brand-logo brand-logo-light" src="/brand/logo-on-light.svg" alt="" width="22" height="22">
        <span>BetterVault</span>
      </div>
      <div class="popup-header-actions">
        <button class="icon-btn" id="popup-open-app" type="button" title="Ouvrir BetterVault" aria-label="Ouvrir BetterVault">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        </button>
        <button class="icon-btn" id="popup-lock" type="button" title="Verrouiller" aria-label="Verrouiller">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
        </button>
      </div>
    </header>

    <div class="popup-site" id="popup-site"></div>

    <div class="search-box popup-search">
      <span class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </span>
      <input type="search" id="popup-search" class="search-input" placeholder="Rechercher" autocomplete="off" spellcheck="false">
    </div>

    <div class="popup-status" id="popup-status" role="status" hidden></div>
    <div class="popup-list" id="popup-list"></div>
  </div>

  <script type="module" src="../src/extension/popup.ts"></script>
</body>
</html>
