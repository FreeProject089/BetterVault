name: Release

# Publier une version : node scripts/version.mjs 1.2.0, commit, puis git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags: ['v*']
  # Lancement manuel : par défaut on construit tout sans rien publier, pour vérifier
  # que les chaînes de build fonctionnent sans attendre le jour de la release.
  workflow_dispatch:
    inputs:
      publier:
        description: 'Publier une release brouillon (sinon simple essai de build)'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  versions:
    name: Versions alignées sur le tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Un installeur 1.1.0 dans une version v1.2.0 : on arrête avant de construire
      - if: github.event_name == 'push'
        run: node scripts/version.mjs --tag "${{ github.ref_name }}"

  docker:
    name: Image Docker (GHCR)
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bettervault
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Bureau (${{ matrix.name }})
    needs: versions
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ''
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signature facultative : définir ces secrets pour des installateurs signés
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # Vide en mode essai : tauri-action construit alors sans créer de release
          tagName: ${{ (github.event_name == 'push' || inputs.publier) && github.ref_name || '' }}
          releaseName: BetterVault ${{ github.ref_name }}
          releaseBody: Voir le détail des changements dans l'historique du dépôt.
          releaseDraft: true
          args: ${{ matrix.args }}
      - name: Installateurs (essai)
        if: ${{ github.event_name != 'push' && !inputs.publier }}
        uses: actions/upload-artifact@v4
        with:
          name: bureau-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android (APK)
    needs: versions
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: NDK
        run: sdkmanager "ndk;27.1.12297006"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci --no-audit --no-fund
      - name: Build
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006
        run: npx tauri android build --apk
      - name: Signature (si le keystore est fourni)
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > release.keystore
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          APK=$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-pass env:ANDROID_KEYSTORE_PASSWORD --ks-key-alias "$ANDROID_KEY_ALIAS" --out bettervault-android.apk aligned.apk
          rm release.keystore
      # Android refuse d'installer un APK non signé : il reste un artefact de la
      # CI (pour vérifier la construction), jamais un fichier de la version.
      - name: APK non signé
        if: env.HAS_KEYSTORE != 'true'
        run: |
          cp "$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -1)" bettervault-android-unsigned.apk
          echo "::warning title=APK non signé::Secret ANDROID_KEYSTORE absent : aucun APK n'est joint à la version (voir docs/developpement/build.md)."
      - uses: softprops/action-gh-release@v2
        if: ${{ env.HAS_KEYSTORE == 'true' && (github.event_name == 'push' || inputs.publier) }}
        with:
          draft: true
          files: bettervault-android.apk
      - name: APK (essai, ou non signé)
        if: ${{ (github.event_name != 'push' && !inputs.publier) || env.HAS_KEYSTORE != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bettervault-android*.apk
          if-no-files-found: error
          retention-days: 14

  extension:
    name: Extension navigateur
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:extension
      - run: cd dist-extension && zip -qr "../bettervault-extension-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        if: ${{ github.event_name == 'push' || inputs.publier }}
        with:
          draft: true
          files: bettervault-extension-*.zip
      - name: Archive (essai)
        if: ${{ github.event_name != 'push' && !inputs.publier }}
        uses: actions/upload-artifact@v4
        with:
          name: extension
          path: bettervault-extension-*.zip
          if-no-files-found: error
          retention-days: 14
