name: bettervault

services:
  bettervault:
    build: .
    image: bettervault:latest
    restart: unless-stopped
    environment:
      BETTERVAULT_SECRET: ${BETTERVAULT_SECRET:?Définir BETTERVAULT_SECRET dans le fichier .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_ALLOW_INVALID_CERT: ${SMTP_ALLOW_INVALID_CERT:-false}
      LIMIT_MAX_VAULTS: ${LIMIT_MAX_VAULTS:-}
      LIMIT_MAX_CREDENTIALS_PER_VAULT: ${LIMIT_MAX_CREDENTIALS_PER_VAULT:-}
      LIMIT_MAX_TASKS_PER_VAULT: ${LIMIT_MAX_TASKS_PER_VAULT:-}
      LIMIT_MAX_TITLE_LENGTH: ${LIMIT_MAX_TITLE_LENGTH:-}
      LIMIT_MAX_USERNAME_LENGTH: ${LIMIT_MAX_USERNAME_LENGTH:-}
      LIMIT_MAX_PASSWORD_LENGTH: ${LIMIT_MAX_PASSWORD_LENGTH:-}
      LIMIT_MAX_URL_LENGTH: ${LIMIT_MAX_URL_LENGTH:-}
      LIMIT_MAX_NOTE_LENGTH: ${LIMIT_MAX_NOTE_LENGTH:-}
      LIMIT_MAX_CUSTOM_FIELDS: ${LIMIT_MAX_CUSTOM_FIELDS:-}
      LIMIT_MAX_TAGS_PER_ITEM: ${LIMIT_MAX_TAGS_PER_ITEM:-}
      LIMIT_MAX_VAULT_MB: ${LIMIT_MAX_VAULT_MB:-}
      LIMIT_MAX_ATTACHMENT_MB: ${LIMIT_MAX_ATTACHMENT_MB:-}
      LIMIT_ATTACHMENT_QUOTA_MB: ${LIMIT_ATTACHMENT_QUOTA_MB:-}
      LIMIT_MAX_VAULT_TYPES: ${LIMIT_MAX_VAULT_TYPES:-}
      LIMIT_MAX_MEMBERS_PER_SHARED_VAULT: ${LIMIT_MAX_MEMBERS_PER_SHARED_VAULT:-}
      LIMIT_MAX_ROLES_PER_SHARED_VAULT: ${LIMIT_MAX_ROLES_PER_SHARED_VAULT:-}
      GEOIP_DB: ${GEOIP_DB:-}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_DPO_CONTACT: ${LEGAL_DPO_CONTACT:-}
      LEGAL_HOSTING_PROVIDER: ${LEGAL_HOSTING_PROVIDER:-}
      LEGAL_HOSTING_LOCATION: ${LEGAL_HOSTING_LOCATION:-}
      LEGAL_EFFECTIVE_DATE: ${LEGAL_EFFECTIVE_DATE:-}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-bettervault-backups}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_PATH_STYLE: ${BACKUP_S3_PATH_STYLE:-true}
    volumes:
      - bettervault-data:/data
    ports:
      # Accessible uniquement depuis la machine hôte ; utiliser le profil « https » pour l'exposer
      - "127.0.0.1:${BETTERVAULT_PORT:-8787}:8787"

  # HTTPS automatique (Let's Encrypt) : docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      bettervault:
        condition: service_healthy
    environment:
      # Requis uniquement avec le profil https (renseigner DOMAIN dans .env)
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Stockage S3 auto-hébergé pour les sauvegardes : docker compose --profile backup up -d
  # Pour un S3 externe (AWS, Backblaze, Scaleway…), ne lancez pas ce profil et renseignez BACKUP_S3_ENDPOINT.
  minio:
    image: minio/minio:latest
    profiles: ["backup"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BACKUP_S3_ACCESS_KEY:-bettervault}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - minio-data:/data
    ports:
      # Console web de MinIO, accessible depuis la machine hôte uniquement
      - "127.0.0.1:9001:9001"

  minio-init:
    image: minio/mc:latest
    profiles: ["backup"]
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${BACKUP_S3_ACCESS_KEY:-bettervault}
      MINIO_ROOT_PASSWORD: ${BACKUP_S3_SECRET_KEY:-}
      BUCKET: ${BACKUP_S3_BUCKET:-bettervault-backups}
    entrypoint: >
      sh -c "until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD >/dev/null 2>&1; do sleep 2; done;
      mc mb --ignore-existing local/$$BUCKET && mc anonymous set none local/$$BUCKET"

volumes:
  bettervault-data:
  caddy-data:
  caddy-config:
  minio-data:
