site_name: BetterVault
site_description: Documentation de BetterVault — mots de passe, 2FA et tâches chiffrés de bout en bout
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: fr
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Mode clair
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Mode sombre
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Les blocs ```mermaid (diagrammes B.MD) deviennent des diagrammes Mermaid
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

nav:
  - Accueil: index.md
  - Guide:
      - Premiers pas: guide/getting-started.md
      - Identifiants et 2FA: guide/credentials.md
      - Tâches: guide/tasks.md
      - Coffres et tags: guide/vaults-tags.md
      - Historique et corbeille: guide/history-trash.md
      - Apparence: guide/appearance.md
      - Import et export: guide/import-export.md
      - Compte et synchronisation: guide/sync.md
      - Sécurité du compte: guide/account-security.md
      - Coffres partagés: guide/sharing.md
      - Pièces jointes: guide/attachments.md
      - Extension navigateur: guide/extension.md
      - Raccourcis clavier: guide/shortcuts.md
  - Déploiement:
      - Installation rapide: deployment/installation.md
      - Docker: deployment/docker.md
      - Sans Docker: deployment/without-docker.md
      - Configuration et sauvegardes: deployment/configuration.md
      - Sauvegardes S3 et RGPD: deployment/backups.md
      - Sessions et lieu: deployment/sessions-location.md
      - Plusieurs serveurs (grappe): deployment/cluster.md
      - Supervision: deployment/monitoring.md
      - Page publique et annuaire: deployment/public-page.md
      - Documents légaux: deployment/legal-documents.md
      - Emails et langues: deployment/emails-languages.md
      - Espace payant (Stripe): deployment/stripe-plans.md
      - Page d'administration: deployment/administration.md
      - Dépannage: deployment/troubleshooting.md
  - Applications:
      - Bureau et mobile: apps/desktop-mobile.md
      - Biométrie et remplissage automatique: apps/biometrics-autofill.md
      - macOS et iOS (à venir): apps/apple.md
  - Sécurité: security.md
  - Zero-knowledge et conformité: compliance.md
  - Développement:
      - Architecture: development/architecture.md
      - Choix techniques: development/technical.md
      - Construire pas à pas: development/build-guide.md
      - Construire l'application: development/build.md
      - Publier une version: development/releasing.md
      - Intégration et déploiement continus: development/ci-cd.md
      - API du serveur: development/api.md
      - Contribuer: development/contributing.md
