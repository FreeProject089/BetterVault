[package]
name = "bettervault"
version = "1.0.0"
description = "BetterVault"
authors = ["BetterVault"]
edition = "2021"

[lib]
name = "bettervault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
# Ouverture des liens (documents légaux, paiement) dans le navigateur du système
tauri-plugin-opener = "2"

# Trousseau du système : Windows, macOS, Linux et iOS (keyring ne prend pas en charge Android)
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Invite biométrique (Face ID / Touch ID) sur iOS ; Android passe par le Keystore (BetterVaultPlugin.kt)
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-biometric = "2"

# Touch ID sur macOS (LocalAuthentication), le secret reste dans le trousseau
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }
block2 = "0.6"

# Windows Hello (visage, empreinte ou code PIN) pour le déverrouillage de l'application de bureau
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Foundation"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
